[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "stronghold-genesis-ai"
version = "0.1.0"
description = "Autonomous AI Omniverse World Generation System"
authors = [{name = "Shanee", email = "baldwinshane09@gmail.com"}]
requires-python = ">=3.11"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = {version = "^0.24.0", extras = ["standard"]}
sqlalchemy = "^2.0"
psycopg2-binary = "^2.9"
alembic = "^1.12"
pydantic = "^2.5"
pydantic-settings = "^2.1"
python-dotenv = "^1.0"
redis = "^5.0"
httpx = "^0.25"
langchain = "^0.1"
langchain-community = "^0.0"
huggingface-hub = "^0.20"
transformers = "^4.35"
torch = {version = "^2.1", optional = true}
apscheduler = "^3.10"
structlog = "^23.2"
pydantic-extra-types = "^2.4"
numpy = "^1.26"
opensearch-py = "^2.3"

[tool.poetry.extras]
torch = ["torch"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.21"
pytest-cov = "^4.1"
black = "^23.12"
ruff = "^0.1"
mypy = "^1.7"
httpx = "^0.25"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
