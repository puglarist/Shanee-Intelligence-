name: Omniverse Engine Orchestrator

on:
  push:
    branches: [main, claude/pensive-keller-1KkYQ]
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode'
        required: false
        default: 'false'

env:
  HF_API_KEY: ${{ secrets.HF_API_KEY }}
  HF_MODEL_ENDPOINT: ${{ secrets.HF_MODEL_ENDPOINT }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DEBUG: 'false'

jobs:
  run-orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r orchestrator/requirements.txt

      - name: Validate configuration
        run: |
          python -c "from orchestrator.config import config; config.validate(); print(f'Configuration valid: {config}')"

      - name: Run orchestrator health check
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from orchestrator.main import app
          from orchestrator.config import config
          print(f'Orchestrator initialized with config: {config}')
          "

      - name: List available agents
        run: |
          python -c "
          from orchestrator.agents import list_agent_roles, count_agents
          agents = list_agent_roles()
          print(f'Total agents: {count_agents()}')
          print(f'Sample agents:')
          for agent in agents[:5]:
              print(f'  - {agent.name}: {agent.description}')
          "

      - name: Check task queue
        run: |
          python -c "
          from orchestrator.tasks import queue
          stats = queue.stats()
          print(f'Task queue status:')
          print(f'  Pending: {stats[\"pending\"]}')
          print(f'  Running: {stats[\"running\"]}')
          print(f'  Completed: {stats[\"completed\"]}')
          print(f'  Failed: {stats[\"failed\"]}')
          "

      - name: Run orchestrator in mock mode (test)
        if: github.event.inputs.test_mode == 'true' || !secrets.HF_API_KEY
        env:
          HF_API_KEY: 'mock'
        run: |
          timeout 30 python orchestrator/main.py &
          sleep 5
          # Test health endpoint
          python -c "
          import requests
          try:
              response = requests.get('http://0.0.0.0:8000/health', timeout=5)
              print(f'Health check response: {response.status_code}')
              print(response.json())
          except Exception as e:
              print(f'Health check failed: {e}')
          " || true
          pkill -f "python orchestrator/main.py" || true

      - name: Execute swarm cycle
        if: secrets.HF_API_KEY && secrets.HF_API_KEY != ''
        env:
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from orchestrator.tasks import queue
          from orchestrator.agents import get_agent_role

          # Create a test task for terrain generation
          agent_role = get_agent_role('TerrainGenerator')
          if agent_role:
              task = queue.enqueue(
                  agent_id='terrain_gen_1',
                  agent_role='TerrainGenerator',
                  task_type='generate',
                  payload={'seed': 42, 'size': 256}
              )
              print(f'Task created: {task.id}')
              print(f'Task status: {task.status}')
          else:
              print('TerrainGenerator agent not found')
          "

      - name: Verify Prisma schema
        run: |
          ls -la prisma/
          cat prisma/schema.prisma | head -20

      - name: Check memory persistence
        run: |
          ls -la memory/
          echo "=== world_state.json ==="
          cat memory/world_state.json | head -10
          echo "=== tasks_queue.json ==="
          cat memory/tasks_queue.json | head -10

      - name: Log execution summary
        run: |
          echo "=== Omniverse Engine Orchestrator Execution Summary ==="
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Mode: $([ -z '${{ secrets.HF_API_KEY }}' ] && echo 'MOCK' || echo 'PRODUCTION')"
          echo "Orchestrator Status: READY"
          echo "Status: SUCCESS"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-logs
          path: memory/
          retention-days: 7

  verify-bridge:
    runs-on: ubuntu-latest
    needs: run-orchestrator

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify orchestration bridge
        run: |
          echo "Verifying orchestration bridge configuration..."
          test -f backend/orchestration-bridge.js && echo "Bridge file exists" || exit 1
          test -d memory && echo "Memory directory exists" || exit 1
          test -f memory/world_state.json && echo "World state file exists" || exit 1
          test -f memory/tasks_queue.json && echo "Tasks queue file exists" || exit 1
          test -f memory/agents.json && echo "Agents file exists" || exit 1
          echo "Bridge verification PASSED"

      - name: Check Prisma schema
        run: |
          echo "Verifying Prisma schema..."
          test -d prisma && echo "Prisma directory exists" || exit 1
          test -f prisma/schema.prisma && echo "Schema file exists" || exit 1
          grep -q "model Agent" prisma/schema.prisma && echo "Agent model defined" || exit 1
          grep -q "model Task" prisma/schema.prisma && echo "Task model defined" || exit 1
          grep -q "model WorldState" prisma/schema.prisma && echo "WorldState model defined" || exit 1
          echo "Schema verification PASSED"
