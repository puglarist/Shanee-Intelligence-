[tool.poetry]
name = "shanee-intelligence-backend"
version = "0.1.0"
description = "Shanee Intelligence - Privacy-focused GPU-accelerated platform"
authors = ["Shanee Intelligence Team"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = {extras = ["email"], version = "^2.4.0"}
pydantic-settings = "^2.0.0"
python-dotenv = "^1.0.0"
pyjwt = "^2.8.0"
cryptography = "^41.0.0"
httpx = "^0.25.0"
email-validator = "^2.1.0"
python-multipart = "^0.0.6"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.10.0"
ruff = "^0.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
